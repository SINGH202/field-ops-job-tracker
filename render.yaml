databases:
  - name: field-ops-db
    databaseName: fieldops
    user: fieldops

services:
  - type: web
    name: field-ops-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: field-ops-db
          property: connectionString
